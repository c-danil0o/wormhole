# Plain bootc node. No libvirt, no nested VMs: this is the direct-management
# node. The VM host lives in config.libvirt.yaml.
vmCount: 1
cpus: 2
memory: 2048
nameBase: "host"
backendType: "libvirt"
diskImage: "~/.wormhole/images/edge-base-v4.0.qcow2"
network: "default"
osVariant: "fedora-unknown"   # newest Fedora libvirt knows; only picks virtual hardware
uefi: true
stateDir: "~/.wormhole/libvirt"
# control-plane addresses ship in the OS image (/usr/lib/c12s/node.env);
# set natsAddress only to override them for these nodes
# natsAddress: "192.168.122.1:4222"
ipBase: "192.168.122."
ipOffset: 50                         # host-1 -> 192.168.122.51
